<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100">
    <div class="min-h-screen flex justify-center items-center">
      <div class="bg-white w-full max-w-3xl shadow-xl rounded-xl">
        <div class="bg-indigo-600 p-6 rounded-t-xl">
          <h1 class="text-3xl font-bold text-white">Complete Your Profile</h1>
        </div>

        <form method="POST" enctype="multipart/form-data" class="p-8">
          {% csrf_token %}

          <div>
    <label class="font-semibold">Full Name</label>

    <input
        type="text"
        name="full_name"
        class="w-full border rounded-lg p-3 mt-2"
        placeholder="Enter Full Name"
        required>
      
        </div>
        

        


          <div class="space-y-5">
            <div>
              <label class="font-semibold">Profile Image</label>
              <input
                type="file"
                name="profile_image"
                required
                class="w-full border rounded-lg p-3 mt-2" />
            </div>

            <div>
              <label class="font-semibold">Gender</label>

              <select name="gender" class="w-full border rounded-lg p-3 mt-2">
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
                
              </select>
              
            </div>

            <div>
              <label class="font-semibold">Date Of Birth</label>

              <input
                type="date"
                name="dob"
                required
                class="w-full border rounded-lg p-3 mt-2" />
            </div>

            <div>
              <label class="font-semibold">Bio</label>

              <textarea
                name="bio"
                rows="5"
                class="w-full border rounded-lg p-3 mt-2"></textarea>
            </div>

            <button
              class="bg-indigo-600 text-white px-8 py-3 rounded-lg hover:bg-indigo-700">
              Save Profile
            </button>
          </div>
        </form>
        
      </div>
    </div>
  </body>
</html>
