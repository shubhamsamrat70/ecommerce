{% extends "base.html" %}

{% block title %}
Contact Us
{% endblock %}

{% block content %}

<div class="min-h-[80vh] flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-2xl">

        <!-- Heading -->

        <div class="text-center mb-8">

            <h1 class="text-4xl font-bold text-gray-800">
                Contact Us
            </h1>

            <p class="text-gray-500 mt-3">
                Have any questions? We'd love to hear from you.
            </p>

        </div>


        <!-- Messages -->

        {% if messages %}

            {% for message in messages %}

                <div class="mb-5 bg-green-100 border border-green-300
                            text-green-700 px-4 py-3 rounded-lg">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <!-- Contact Form -->

        <div class="bg-white rounded-2xl shadow-lg p-8">

            <form method="POST"
                  action="{% url 'contact' %}">

                {% csrf_token %}


                <!-- Name -->

                <div class="mb-5">

                    <label class="block text-gray-700
                                  font-semibold mb-2">

                        Name

                    </label>

                    <input type="text"
                           name="name"
                           required
                           class="w-full border border-gray-300
                                  rounded-lg px-4 py-3
                                  focus:ring-2 focus:ring-indigo-500
                                  focus:border-indigo-500
                                  outline-none"
                           placeholder="Enter your name">

                </div>


                <!-- Email -->

                <div class="mb-5">

                    <label class="block text-gray-700
                                  font-semibold mb-2">

                        Email

                    </label>

                    <input type="email"
                           name="email"
                           required
                           class="w-full border border-gray-300
                                  rounded-lg px-4 py-3
                                  focus:ring-2 focus:ring-indigo-500
                                  focus:border-indigo-500
                                  outline-none"
                           placeholder="Enter your email">

                </div>


                <!-- Subject -->

                <div class="mb-5">

                    <label class="block text-gray-700
                                  font-semibold mb-2">

                        Subject

                    </label>

                    <input type="text"
                           name="subject"
                           required
                           class="w-full border border-gray-300
                                  rounded-lg px-4 py-3
                                  focus:ring-2 focus:ring-indigo-500
                                  focus:border-indigo-500
                                  outline-none"
                           placeholder="Enter subject">

                </div>


                <!-- Message -->

                <div class="mb-6">

                    <label class="block text-gray-700
                                  font-semibold mb-2">

                        Message

                    </label>

                    <textarea name="message"
                              rows="6"
                              required
                              class="w-full border border-gray-300
                                     rounded-lg px-4 py-3
                                     focus:ring-2 focus:ring-indigo-500
                                     focus:border-indigo-500
                                     outline-none resize-none"
                              placeholder="Write your message..."></textarea>

                </div>


                <!-- Submit -->

                <button type="submit"
                        class="w-full bg-indigo-600
                               hover:bg-indigo-700
                               text-white font-semibold
                               py-3 rounded-lg
                               transition">

                    Send Message

                </button>

            </form>

        </div>


        <!-- Back Home -->

        <div class="text-center mt-6">

            <a href="{% url 'ecommerce' %}"
               class="text-indigo-600
                      hover:text-indigo-800
                      font-semibold">

                ← Back to Home

            </a>

        </div>

    </div>

</div>

{% endblock %}
