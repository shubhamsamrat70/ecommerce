<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Address</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="min-h-screen flex items-center justify-center py-10 px-4">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl">

        <!-- Header -->
        <div class="bg-indigo-600 rounded-t-2xl px-8 py-6">

            <h1 class="text-3xl font-bold text-white">
                Edit Address
            </h1>

            <p class="text-indigo-100 mt-1">
                Update your delivery address
            </p>

        </div>

        <form method="POST" class="p-8">

            {% csrf_token %}

            <div class="grid md:grid-cols-2 gap-6">

                <!-- Full Name -->
                <div>
                    <label class="block font-semibold mb-2">
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="full_name"
                        value="{{ address.full_name }}"
                        required
                        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <!-- Phone -->
                <div>
                    <label class="block font-semibold mb-2">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        name="phone"
                        value="{{ address.phone }}"
                        required
                        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <!-- Address Line 1 -->
                <div class="md:col-span-2">
                    <label class="block font-semibold mb-2">
                        Address Line 1
                    </label>

                    <input
                        type="text"
                        name="address_line1"
                        value="{{ address.address_line1 }}"
                        required
                        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <!-- Address Line 2 -->
                <div class="md:col-span-2">
                    <label class="block font-semibold mb-2">
                        Address Line 2
                    </label>

                    <input
                        type="text"
                        name="address_line2"
                        value="{{ address.address_line2 }}"
                        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <!-- City -->
                <div>
                    <label class="block font-semibold mb-2">
                        City
                    </label>

                    <input
                        type="text"
                        name="city"
                        value="{{ address.city }}"
                        required
                        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <!-- State -->
                <div>
                    <label class="block font-semibold mb-2">
                        State
                    </label>

                    <input
                        type="text"
                        name="state"
                        value="{{ address.state }}"
                        required
                        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <!-- Pincode -->
                <div>
                    <label class="block font-semibold mb-2">
                        Pincode
                    </label>

                    <input
                        type="text"
                        name="pincode"
                        value="{{ address.pincode }}"
                        required
                        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <!-- Default Address -->
                <div class="flex items-center mt-8">

                    <input
                        type="checkbox"
                        name="is_default"
                        value="True"
                        {% if address.is_default %}checked{% endif %}
                        class="w-5 h-5 text-indigo-600">

                    <label class="ml-3 font-medium">
                        Make this my default address
                    </label>

                </div>

            </div>

            <!-- Buttons -->
            <div class="flex gap-4 mt-8">

                <button
                    type="submit"
                    class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-semibold">

                    Update Address

                </button>

                <a href="{% url 'view_address' %}"
                   class="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-3 rounded-lg text-center font-semibold">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
