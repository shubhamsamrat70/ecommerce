<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="min-h-screen flex items-center justify-center py-10 px-4">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl">

        <!-- Header -->
        <div class="bg-indigo-600 rounded-t-2xl px-8 py-6">

            <h1 class="text-3xl font-bold text-white">
                Edit Profile
            </h1>

            <p class="text-indigo-100 mt-1">
                Update your personal information
            </p>

        </div>

        <form method="POST" enctype="multipart/form-data" class="p-8">

            {% csrf_token %}

            <div class="grid md:grid-cols-2 gap-6">

                <!-- Full Name -->
                <div>
                    <label class="block font-semibold mb-2">
                        Full Name
                            </label>
        <input
            type="text"
            name="full_name"
            value="{{ profile.user.name }}"
            class="w-full border rounded-lg px-4 py-3">
                </div>

                <!-- Gender -->
                <div>

                    <label class="block font-semibold mb-2">
                        Gender
                    </label>

                    <select
                        name="gender"
                        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">

                        <option value="Male"
                        {% if profile.gender == "Male" %}selected{% endif %}>
                            Male
                        </option>

                        <option value="Female"
                        {% if profile.gender == "Female" %}selected{% endif %}>
                            Female
                        </option>

                        <option value="Other"
                        {% if profile.gender == "Other" %}selected{% endif %}>
                            Other
                        </option>

                    </select>

                </div>

                <!-- Date Of Birth -->

                <div>

                    <label class="block font-semibold mb-2">
                        Date Of Birth
                    </label>

                    <input
                        type="date"
                        name="dob"
                        value="{{ profile.dob|date:'Y-m-d' }}"
                        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">

                </div>

                <div>

                    <label class="block font-semibold mb-2">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        value="{{ profile.user.email }}"
                        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">

                </div>


                <!-- Profile Image -->

                <div>

                    <label class="block font-semibold mb-2">
                        Profile Image
                    </label>

                    <input
                        type="file"
                        name="profile_image"
                        class="w-full border rounded-lg px-4 py-3">

                </div>

                <!-- Bio -->

                <div class="md:col-span-2">

                    <label class="block font-semibold mb-2">
                        Bio
                    </label>

                    <textarea
                        name="bio"
                        rows="5"
                        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">{{ profile.bio }}</textarea>

                </div>

            </div>

            <!-- Current Image -->

            {% if profile.profile_image %}

            <div class="mt-6">

                <label class="font-semibold">
                    Current Profile Image
                </label>

                <img
                    src="{{ profile.profile_image.url }}"
                    class="w-28 h-28 rounded-full mt-3 border object-cover">

            </div>

            {% endif %}

            <!-- Buttons -->

            <div class="flex gap-4 mt-8">

                <button
                    type="submit"
                    class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-semibold">

                    Update Profile

                </button>

                <a
                    href="{% url 'view_profile' %}"
                    class="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-3 rounded-lg text-center font-semibold">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
