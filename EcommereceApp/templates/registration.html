<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-indigo-100 to-purple-100 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md bg-white shadow-2xl rounded-2xl overflow-hidden">

        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-center">
            <h2 class="text-3xl font-bold text-white">
                User Registration
            </h2>
            <p class="text-indigo-100 mt-2">
                Create your account
            </p>
        </div>

        <!-- Form -->
        <form method="POST" class="p-8 space-y-5">

            {% csrf_token %}

            <!-- Name -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    required>
            </div>

            <!-- Email -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    required>
            </div>

            <!-- Phone -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    placeholder="Enter your phone number"
                    class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    required>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    required>
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Enter your confirm password"
                    class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    required>
            </div>

            <!-- Register Button -->
            <button
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-semibold transition">
                Register
            </button>

            <!-- Login Link -->
            <p class="text-center text-gray-600">
                
                Already have an account?
                <a href="{% url 'userlogin' %}" class="text-indigo-600 font-semibold hover:underline">
                    Login
                </a>
                
            </p>

        </form>

    </div>

</body>
</html>
