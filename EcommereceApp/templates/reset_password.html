<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg">

        <h1 class="text-3xl font-bold text-center text-indigo-600">
            Reset Password
        </h1>

        <p class="text-gray-500 text-center mt-2">
            Create your new password
        </p>

        {% if error %}
            <div class="bg-red-100 text-red-600 p-3 rounded-lg mt-5">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" class="mt-6">

            {% csrf_token %}

            <label class="font-semibold">
                New Password
            </label>

            <input
                type="password"
                name="password"
                required
                placeholder="Enter new password"
                class="w-full border rounded-lg p-3 mt-2 mb-5"
            >

            <label class="font-semibold">
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                required
                placeholder="Confirm new password"
                class="w-full border rounded-lg p-3 mt-2"
            >

            <button
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg mt-6 font-semibold"
            >
                Reset Password
            </button>

        </form>

    </div>

</body>

</html>
