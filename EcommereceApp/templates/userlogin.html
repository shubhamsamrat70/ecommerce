<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-indigo-100 to-purple-100 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">

        <!-- Header -->
        <div class="bg-indigo-600 py-6">
            <h2 class="text-3xl font-bold text-center text-white">
                Welcome Back
            </h2>
            <p class="text-center text-indigo-100 mt-2">
                Login to your account
            </p>
        </div>

        <!-- Login Form -->
        <form method="POST" class="p-8 space-y-6">

            {% csrf_token %}

            <!-- Email -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    required>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    required>
            </div>

            <!-- Remember Me + Forgot Password -->
            <div class="flex justify-between items-center text-sm">

                <label class="flex items-center gap-2">
                    <input type="checkbox" class="accent-indigo-600">
                    Remember Me
                </label>

                <div class="text-right mt-2">

            <a href="{% url 'forgot_password' %}"
            class="text-indigo-600 hover:text-indigo-800 text-sm">

                Forgot Password?

            </a>

        </div>

            </div>

            <!-- Login Button -->
            <button
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-semibold transition duration-300">

                Login

            </button>

            <!-- Register Link -->
            <p class="text-center text-gray-600">

                Don't have an account?

                <a href="{% url 'registeration' %}"
                   class="text-indigo-600 font-semibold hover:underline">

                    Register

                </a>

            </p>

        </form>

    </div>

</body>
</html>
