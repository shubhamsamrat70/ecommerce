<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 mt-10 ml-5">

    <a
            href="{% url 'dashboard' %}"
            class="bg-blue-600 hover:bg-gray-700 text-white px-8 py-3 rounded-lg">
            Back to Dashboard
          </a>
          </div>

    <div class="max-w-5xl mx-auto mt-10 mb-10 bg-white shadow-xl rounded-xl">
      <div class="bg-indigo-600 p-6 rounded-t-xl">
        <h1 class="text-3xl font-bold text-white">Add Product</h1>
      </div>

      <form method="POST" enctype="multipart/form-data" class="p-8">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Category -->
          <div>
            <label class="block text-sm font-medium mb-2">Category</label>

            <select
              name="category"
              id="category"
              class="w-full border rounded-lg p-3">
              <option value="">Select Category</option>

              {% for i in category %}

              <option value="{{ i.id }}">{{ i.category_name }}</option>

              {% endfor %}
            </select>
          </div>

          <!-- Sub Category -->
          <div>
            <label class="font-semibold">Sub Category</label>
            <select
              name="sub_category"
              id="subcategory"
              class="w-full border rounded-lg p-3 mt-2"
              disabled>
              <option value="">Select Sub Category</option>

              {% for i in sub_category %}
              <option value="{{ i.id }}">{{ i.Sub_category_name }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Brand -->
          <div>
            <label class="font-semibold">Brand</label>

            <select
              name="brand"
              id="brand"
              class="w-full border rounded-lg p-3 mt-2"
              disabled>
              <option value="">Select Brand</option>

              {% for i in brand %}
              <option value="{{ i.id }}">{{ i.brand_name }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Product Name -->
          <div>
            <label class="font-semibold">Product Name</label>

            <input
              type="text"
              name="product_name"
              class="w-full border rounded-lg p-3 mt-2"
              placeholder="Enter Product Name"
              required />
          </div>

          <!-- Slug -->
          <div>
            <label class="font-semibold">Slug</label>

            <input
              type="text"
              name="slug"
              class="w-full border rounded-lg p-3 mt-2"
              placeholder="product-slug"
              required />
          </div>

          <!-- Price -->
          <div>
            <label class="font-semibold">Price</label>

            <input
              type="number"
              step="0.01"
              name="price"
              class="w-full border rounded-lg p-3 mt-2"
              placeholder="Product Price"
              required />
          </div>

          <!-- Discount Price -->
          <div>
            <label class="font-semibold">Discount Price</label>

            <input
              type="number"
              step="0.01"
              name="discount_price"
              class="w-full border rounded-lg p-3 mt-2"
              placeholder="Discount Price" />
          </div>

          <!-- Stock -->
          <div>
            <label class="font-semibold">Stock</label>

            <input
              type="number"
              name="stock"
              class="w-full border rounded-lg p-3 mt-2"
              placeholder="Available Stock"
              required />
          </div>

          <!-- Rating -->
          <div>
            <label class="font-semibold">Rating</label>

            <input
              type="number"
              step="0.01"
              min="0"
              max="5"
              name="rating"
              value="0"
              class="w-full border rounded-lg p-3 mt-2" />
          </div>

          <!-- Image -->
          <div>
            <label class="font-semibold">Product Image</label>

            <input
              type="file"
              name="image"
              class="w-full border rounded-lg p-3 mt-2"
              required />
          </div>

          <!-- Status -->
          <div>
            <label class="font-semibold">Status</label>

            <select name="status" class="w-full border rounded-lg p-3 mt-2">
              <option value="True">Active</option>
              <option value="False">Inactive</option>
            </select>
          </div>
        </div>

        <!-- Description -->
        <div class="mt-6">
          <label class="font-semibold">Description</label>

          <textarea
            name="description"
            rows="5"
            class="w-full border rounded-lg p-3 mt-2"
            placeholder="Enter Product Description"></textarea>
        </div>

        <!-- Buttons -->
        <div class="mt-8 flex gap-4">
          <button
            type="submit"
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-lg">
            Save Product
          </button>

          <a
            href="{% url 'view_product' %}"
            class="bg-gray-600 hover:bg-gray-700 text-white px-8 py-3 rounded-lg">
            View Products
          </a>
          
        </div>
      </form>
    </div>

    <script>
      const category = document.getElementById("category");
      const subcategory = document.getElementById("subcategory");
      const brand = document.getElementById("brand");

      // Initially Disable
      subcategory.disabled = true;
      brand.disabled = true;

      // Category Change
      category.addEventListener("change", function () {
        let category_id = this.value;

        subcategory.innerHTML = '<option value="">Select Sub Category</option>';

        brand.innerHTML = '<option value="">Select Brand</option>';

        brand.disabled = true;

        if (category_id == "") {
          subcategory.disabled = true;
          return;
        }

        fetch("{% url 'load_subcategory' %}?category_id=" + category_id)
          .then((res) => res.json())

          .then((data) => {
            data.forEach((item) => {
              subcategory.innerHTML += `<option value="${item.id}">
                ${item.name}
            </option>`;
            });

            subcategory.disabled = false;
          });
      });

      // SubCategory Change
      subcategory.addEventListener("change", function () {
        let sub_id = this.value;

        brand.innerHTML = '<option value="">Select Brand</option>';

        if (sub_id == "") {
          brand.disabled = true;
          return;
        }

        fetch("{% url 'load_brand' %}?sub_category_id=" + sub_id)
          .then((res) => res.json())

          .then((data) => {
            data.forEach((item) => {
              brand.innerHTML += `<option value="${item.id}">
                ${item.name}
            </option>`;
            });

            brand.disabled = false;
          });
      });
    </script>
  </body>
</html>
