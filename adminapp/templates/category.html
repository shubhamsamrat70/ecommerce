<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Category</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100">
    <div class="mt-[25px] ml-[250px]">
     <a
            href="{% url 'dashboard' %}"
            class="bg-blue-600 hover:bg-gray-700 text-white px-8 py-3 rounded-lg">
            Back to Dashboard
          </a>
          </div>


<div class="min-h-screen flex items-center justify-center p-8">
   
          

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl">

        <div class="bg-indigo-600 rounded-t-2xl px-8 py-6">
            <h1 class="text-3xl font-bold text-white">
                Add Category
            </h1>
            <p class="text-indigo-100 mt-1">
                Create New Product Category
            </p>
        </div>

        


        <form action="" method="POST" enctype="multipart/form-data" class="p-8 space-y-6">

            {% csrf_token %}

            <!-- Category Name -->
            <div>
                <label class="block font-semibold text-gray-700 mb-2">
                    Category Name
                </label>

                <input
                    type="text"
                    name="category_name"
                    placeholder="Enter Category Name"
                    required
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <!-- Slug -->
            <div>
                <label class="block font-semibold text-gray-700 mb-2">
                    Slug
                </label>

                <input
                    type="text"
                    name="slug"
                    placeholder="electronics"
                    required
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <!-- Image -->
            <div>
                <label class="block font-semibold text-gray-700 mb-2">
                    Category Image
                </label>

                <input
                    type="file"
                    name="image"
                    required
                    class="w-full border rounded-lg p-3">
            </div>

            <!-- Description -->
            <div>
                <label class="block font-semibold text-gray-700 mb-2">
                    Description
                </label>

                <textarea
                    name="description"
                    rows="5"
                    placeholder="Enter Category Description"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
            </div>

            <!-- Status -->
            <div>
                <label class="block font-semibold text-gray-700 mb-2">
                    Status
                </label>

                <select
                    name="status"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">

                    <option value="True">Active</option>
                    <option value="False">Inactive</option>

                </select>
            </div>

            <!-- Buttons -->
            <div class="flex gap-4">

                <button
                    type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-semibold">

                    Save Category

                </button>

                <button
                    type="reset"
                    class="w-full bg-gray-500 hover:bg-gray-600 text-white py-3 rounded-lg font-semibold">

                    Reset

                </button>

            </div>
            <div>
            {% for msg in messeges %}
            {% if msg %}
            {{ msg }}
            {% endif %}
            {% endfor %}
            </div>


        </form>

    </div>

</div>

</body>
</html>
