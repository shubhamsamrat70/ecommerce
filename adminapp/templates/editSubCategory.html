<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Sub Category</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-3xl mx-auto mt-10 bg-white rounded-xl shadow-lg">

    <!-- Header -->
    <div class="bg-blue-600 rounded-t-xl p-6">
        <h2 class="text-3xl font-bold text-white">
            Edit Sub Category
        </h2>
    </div>

    <!-- Form -->
    <form method="POST" class="p-8 space-y-6">

        {% csrf_token %}

        <!-- Category -->
        <div>
            <label class="block font-semibold mb-2">
                Select Category
            </label>

            <select name="category"
                class="w-full border rounded-lg p-3">
              
                {% for c in categories %}
                


                <option value="{{ c.id }}"
                {% if c.id == subcategory.category.id %}selected{% endif %}>

                    {{ c.category_name }}

                </option>

                {% endfor %}

            </select>
        </div>

        <!-- Sub Category Name -->
        <div>
            <label class="block font-semibold mb-2">
                Sub Category Name
            </label>

            <input
                type="text"
                name="subcategory"
                value="{{ subcategory.Sub_category_name }}"
                class="w-full border rounded-lg p-3"
                placeholder="Enter Sub Category">
        </div>

        <!-- Slug -->
        <div>
            <label class="block font-semibold mb-2">
                Slug
            </label>

            <input
                type="text"
                name="slug"
                value="{{ subcategory.sub_slug }}"
                class="w-full border rounded-lg p-3"
                placeholder="Enter Slug">
        </div>

        <!-- Description -->
        <div>
            <label class="block font-semibold mb-2">
                Description
            </label>

            <textarea
                name="description"
                rows="5"
                class="w-full border rounded-lg p-3"
                placeholder="Enter Description">{{ subcategory.sub_desc }}</textarea>
        </div>

        <!-- Status -->
        <div>
            <label class="block font-semibold mb-2">
                Status
            </label>

            <select
                name="status"
                class="w-full border rounded-lg p-3">

                <option value="True"
                {% if subcategory.status %}selected{% endif %}>
                    Active
                </option>

                <option value="False"
                {% if not subcategory.status %}selected{% endif %}>
                    Inactive
                </option>

            </select>

        </div>

        <!-- Buttons -->
        <div class="flex gap-4">

            <button
                type="submit"
                class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-lg">

                Update Sub Category

            </button>

            <a href="{% url 'sub_category_view' %}"
               class="bg-gray-600 hover:bg-gray-700 text-white px-8 py-3 rounded-lg">

                Cancel

            </a>

        </div>

    </form>

</div>

</body>
</html>
