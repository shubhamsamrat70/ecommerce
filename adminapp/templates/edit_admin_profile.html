
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Admin Profile</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


<div class="max-w-3xl mx-auto py-10 px-5">


    <!-- MAIN CARD -->

    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">


        <!-- HEADER -->

        <div class="bg-indigo-600 text-white p-7">

            <h1 class="text-3xl font-bold">
                Edit Profile
            </h1>

            <p class="mt-2 text-indigo-100">
                Update your admin profile information
            </p>

        </div>



        <!-- FORM -->

        <form method="POST"
              enctype="multipart/form-data"
              class="p-8">

            {% csrf_token %}



            <!-- PROFILE IMAGE -->

            <div class="flex justify-center mb-6">

                {% if admin.image %}

                    <img src="{{ admin.image.url }}"
                         alt="{{ admin.name }}"
                         class="w-32 h-32 rounded-full
                                object-cover
                                border-4 border-indigo-100
                                shadow">

                {% else %}

                    <div class="w-32 h-32 rounded-full
                                bg-gray-200
                                flex items-center
                                justify-center
                                text-5xl">

                        👤

                    </div>

                {% endif %}

            </div>



            <!-- CHANGE IMAGE -->

            <div class="mb-6">

                <label class="block font-semibold mb-2">
                    Change Profile Image
                </label>

                <input type="file"
                       name="image"
                       accept="image/*"
                       class="w-full border rounded-lg
                              p-3
                              focus:ring-2
                              focus:ring-indigo-500
                              outline-none">

            </div>



            <!-- NAME -->

            <div class="mb-5">

                <label class="block font-semibold mb-2">
                    Name
                </label>

                <input type="text"
                       name="name"
                       value="{{ admin.name }}"
                       required
                       class="w-full border rounded-lg
                              px-4 py-3
                              focus:ring-2
                              focus:ring-indigo-500
                              outline-none">

            </div>



            <!-- EMAIL -->

            <div class="mb-5">

                <label class="block font-semibold mb-2">
                    Email
                </label>

                <input type="email"
                       name="email"
                       value="{{ admin.email }}"
                       required
                       class="w-full border rounded-lg
                              px-4 py-3
                              focus:ring-2
                              focus:ring-indigo-500
                              outline-none">

            </div>



            <!-- PHONE -->

            <div class="mb-7">

                <label class="block font-semibold mb-2">
                    Phone
                </label>

                <input type="text"
                       name="phone"
                       value="{{ admin.phone }}"
                       required
                       class="w-full border rounded-lg
                              px-4 py-3
                              focus:ring-2
                              focus:ring-indigo-500
                              outline-none">

            </div>



            <!-- BUTTONS -->

            <div class="flex gap-4">


                <!-- BACK -->

                <a href="{% url 'admin_profile' %}"
                   class="bg-gray-500
                          hover:bg-gray-600
                          text-white
                          px-6 py-3
                          rounded-lg
                          transition">

                    ← Back

                </a>



                <!-- SAVE -->

                <button type="submit"
                        class="bg-indigo-600
                               hover:bg-indigo-700
                               text-white
                               px-6 py-3
                               rounded-lg
                               transition">

                    Save Changes

                </button>

            </div>


        </form>

    </div>

</div>


</body>

</html>
