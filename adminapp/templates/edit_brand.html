<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Brand</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-3xl mx-auto mt-10 bg-white shadow-xl rounded-xl">

    <div class="bg-blue-600 p-6 rounded-t-xl">
        <h1 class="text-3xl text-white font-bold">
            Edit Brand
        </h1>
    </div>

    <form method="POST" enctype="multipart/form-data" class="p-8 space-y-6">

        {% csrf_token %}

        <div>
            <label class="font-semibold">Brand Name</label>

            <input
                type="text"
                name="brand_name"
                value="{{ brand.brand_name }}"
                class="w-full border rounded-lg p-3 mt-2">
        </div>

        <div>
            <label class="font-semibold">Slug</label>

            <input
                type="text"
                name="slug"
                value="{{ brand.slug }}"
                class="w-full border rounded-lg p-3 mt-2">
        </div>

        <div>

            <label class="font-semibold">Current Image</label>

            {% if brand.image %}
            <img src="{{ brand.image.url }}"
                 class="w-28 h-28 rounded-lg mt-3 mb-4">
            {% endif %}

            <input
                type="file"
                name="image"
                class="w-full border rounded-lg p-3">

        </div>

        <div>

            <label class="font-semibold">Description</label>

            <textarea
                name="description"
                rows="5"
                class="w-full border rounded-lg p-3 mt-2">{{ brand.description }}</textarea>

        </div>

        <div>

            <label class="font-semibold">Status</label>

            <select
                name="status"
                class="w-full border rounded-lg p-3 mt-2">

                <option value="True" {% if brand.status %}selected{% endif %}>
                    Active
                </option>

                <option value="False" {% if not brand.status %}selected{% endif %}>
                    Inactive
                </option>

            </select>

        </div>

        <div class="flex gap-4">

            <button
                class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-lg">

                Update Brand

            </button>

            <a href="{% url 'view_brand' %}"
               class="bg-gray-600 hover:bg-gray-700 text-white px-8 py-3 rounded-lg">

                Cancel

            </a>

        </div>

    </form>

</div>

</body>
</html>
