<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Product</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <div class="max-w-5xl mx-auto mt-10 mb-10 bg-white shadow-xl rounded-xl">
      <div class="bg-yellow-500 p-6 rounded-t-xl">
        <h1 class="text-3xl font-bold text-white">Edit Product</h1>
      </div>

      <form method="POST" enctype="multipart/form-data" class="p-8">
        {% csrf_token %}

        <div class="grid md:grid-cols-2 gap-6">
          <!-- Category -->
          <div>
            <label class="font-semibold">Category</label>

            <select
              name="category"
              id="category"
              class="w-full border rounded-lg p-3 mt-2">
              {% for i in category %}

              <option
                value="{{ i.id }}"
                {%
                if
                product.category.id=""
                ="i.id"
                %}selected{%
                endif
                %}>
                {{ i.category_name }}
              </option>

              {% endfor %}
            </select>
          </div>

          <!-- Sub Category -->
          <div>
            <label class="font-semibold">Sub Category</label>

            <select
              name="sub_category"
              id="subcategory"
              class="w-full border rounded-lg p-3 mt-2">
              {% for i in sub_category %}

              <option
                value="{{ i.id }}"
                {%
                if
                product.sub_category.id=""
                ="i.id"
                %}selected{%
                endif
                %}>
                {{ i.Sub_category_name }}
              </option>

              {% endfor %}
            </select>
          </div>

          <!-- Brand -->
          <div>
            <label class="font-semibold">Brand</label>

            <select
              name="brand"
              id="brand"
              class="w-full border rounded-lg p-3 mt-2">
              {% for i in brand %}

              <option
                value="{{ i.id }}"
                {%
                if
                product.brand.id=""
                ="i.id"
                %}selected{%
                endif
                %}>
                {{ i.brand_name }}
              </option>

              {% endfor %}
            </select>
          </div>

          <!-- Product Name -->
          <div>
            <label class="font-semibold">Product Name</label>

            <input
              type="text"
              name="product_name"
              value="{{ product.product_name }}"
              class="w-full border rounded-lg p-3 mt-2" />
          </div>

          <!-- Slug -->
          <div>
            <label class="font-semibold">Slug</label>

            <input
              type="text"
              name="slug"
              value="{{ product.slug }}"
              class="w-full border rounded-lg p-3 mt-2" />
          </div>

          <!-- Price -->
          <div>
            <label class="font-semibold">Price</label>

            <input
              type="number"
              step="0.01"
              name="price"
              value="{{ product.price }}"
              class="w-full border rounded-lg p-3 mt-2" />
          </div>

          <!-- Discount Price -->
          <div>
            <label class="font-semibold">Discount Price</label>

            <input
              type="number"
              step="0.01"
              name="discount_price"
              value="{{ product.discount_price }}"
              class="w-full border rounded-lg p-3 mt-2" />
          </div>

          <!-- Stock -->
          <div>
            <label class="font-semibold">Stock</label>

            <input
              type="number"
              name="stock"
              value="{{ product.stock }}"
              class="w-full border rounded-lg p-3 mt-2" />
          </div>

          <!-- Rating -->
          <div>
            <label class="font-semibold">Rating</label>

            <input
              type="number"
              step="0.01"
              min="0"
              max="5"
              name="rating"
              value="{{ product.rating }}"
              class="w-full border rounded-lg p-3 mt-2" />
          </div>

          <!-- Current Image -->
          <div>
            <label class="font-semibold">Current Image</label>

            {% if product.image %}
            <img
              src="{{ product.image.url }}"
              class="w-28 h-28 rounded-lg mt-3 mb-3" />
            {% endif %}

            <input
              type="file"
              name="image"
              class="w-full border rounded-lg p-3" />
          </div>

          <!-- Status -->
          <div>
            <label class="font-semibold">Status</label>

            <select name="status" class="w-full border rounded-lg p-3 mt-2">
              <option value="True" {% if product.status %}selected{% endif %}>
                Active
              </option>

              <option
                value="False"
                {%
                if
                not
                product.status
                %}selected{%
                endif
                %}>
                Inactive
              </option>
            </select>
          </div>
        </div>

        <!-- Description -->

        <div class="mt-6">
          <label class="font-semibold">Description</label>

          <textarea
            name="description"
            rows="5"
            class="w-full border rounded-lg p-3 mt-2">
{{ product.description }}</textarea
          >
        </div>

        <!-- Buttons -->

        <div class="mt-8 flex gap-4">
          <button
            type="submit"
            class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-lg">
            Update Product
          </button>

          <a
            href="{% url 'view_product' %}"
            class="bg-gray-600 hover:bg-gray-700 text-white px-8 py-3 rounded-lg">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </body>

  <script>
    const category = document.getElementById("category");
    const subcategory = document.getElementById("subcategory");
    const brand = document.getElementById("brand");

    category.addEventListener("change", function () {
      let category_id = this.value;

      subcategory.innerHTML = '<option value="">Select Sub Category</option>';
      brand.innerHTML = '<option value="">Select Brand</option>';

      fetch(`/load-subcategory/?category_id=${category_id}`)
        .then((res) => res.json())

        .then((data) => {
          data.forEach(function (item) {
            subcategory.innerHTML += `<option value="${item.id}">
            ${item.name}
            </option>`;
          });
        });
    });

    subcategory.addEventListener("change", function () {
      let sub_id = this.value;

      brand.innerHTML = '<option value="">Select Brand</option>';

      fetch(`/load-brand/?sub_category_id=${sub_id}`)
        .then((res) => res.json())

        .then((data) => {
          data.forEach(function (item) {
            brand.innerHTML += `<option value="${item.id}">
            ${item.name}
            </option>`;
          });
        });
    });
  </script>
</html>
