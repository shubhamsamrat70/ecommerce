<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Admin Password</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-100
             flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8">

            <!-- Icon -->
            <div class="flex justify-center mb-5">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600
                            rounded-full flex items-center justify-center">

                    <i class="fa-solid fa-lock text-2xl"></i>

                </div>
            </div>

            <!-- Heading -->
            <div class="text-center mb-7">

                <h1 class="text-2xl font-bold text-gray-800">
                    Forgot Password?
                </h1>

                <p class="text-gray-500 text-sm mt-2">
                    Enter your registered email address to receive an OTP
                    for password reset.
                </p>

            </div>


            <!-- Django Messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="mb-5 px-4 py-3 rounded-lg
                                bg-red-50 text-red-600 text-sm text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}


            <!-- Form -->
            <form method="POST">

                {% csrf_token %}

                <!-- Email -->
                <div class="mb-6">

                    <label for="email"
                           class="block text-sm font-semibold text-gray-700 mb-2">

                        <i class="fa-solid fa-envelope text-indigo-500 mr-1"></i>

                        Email Address

                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        required
                        class="w-full px-4 py-3 border border-gray-300
                               rounded-lg outline-none
                               focus:ring-2 focus:ring-indigo-500
                               focus:border-indigo-500
                               transition"
                    >

                </div>


                <!-- Button -->
                <button
                    type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700
                           text-white font-semibold py-3 rounded-lg
                           transition duration-200
                           flex items-center justify-center gap-2">

                    <i class="fa-solid fa-paper-plane"></i>

                    Send OTP

                </button>

            </form>


            <!-- Back to Login -->
            <div class="text-center mt-6">

                <a href="{% url 'adminlogin' %}"
                   class="text-sm text-indigo-600 hover:text-indigo-800
                          font-medium transition">

                    <i class="fa-solid fa-arrow-left mr-1"></i>

                    Back to Login

                </a>

            </div>

        </div>


        <!-- Footer -->
        <p class="text-center text-gray-500 text-xs mt-6">
            © 2026 ShopMart Admin Panel. All rights reserved.
        </p>

    </div>

</body>
</html>
