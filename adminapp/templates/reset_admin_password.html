<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Admin Password</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-100
             flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8">

            <!-- Icon -->
            <div class="flex justify-center mb-5">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600
                            rounded-full flex items-center justify-center">

                    <i class="fa-solid fa-key text-2xl"></i>

                </div>
            </div>


            <!-- Heading -->
            <div class="text-center mb-7">

                <h1 class="text-2xl font-bold text-gray-800">
                    Reset Password
                </h1>

                <p class="text-gray-500 text-sm mt-2">
                    Enter your new password below.
                </p>

            </div>


            <!-- Messages -->
            {% if messages %}
                {% for message in messages %}

                    <div class="mb-5 px-4 py-3 rounded-lg
                                bg-red-50 text-red-600
                                text-sm text-center">

                        {{ message }}

                    </div>

                {% endfor %}
            {% endif %}


            <!-- Form -->
            <form method="POST">

                {% csrf_token %}


                <!-- New Password -->
                <div class="mb-5">

                    <label for="password"
                           class="block text-sm font-semibold
                                  text-gray-700 mb-2">

                        <i class="fa-solid fa-lock text-indigo-500 mr-1"></i>

                        New Password

                    </label>


                    <div class="relative">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter new password"
                            required
                            class="w-full px-4 py-3 pr-12
                                   border border-gray-300
                                   rounded-lg outline-none
                                   focus:ring-2 focus:ring-indigo-500
                                   focus:border-indigo-500
                                   transition"
                        >

                        <button
                            type="button"
                            onclick="togglePassword('password', 'eye1')"
                            class="absolute right-4 top-1/2
                                   -translate-y-1/2
                                   text-gray-400 hover:text-indigo-600">

                            <i id="eye1"
                               class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="mb-6">

                    <label for="confirm_password"
                           class="block text-sm font-semibold
                                  text-gray-700 mb-2">

                        <i class="fa-solid fa-lock text-indigo-500 mr-1"></i>

                        Confirm Password

                    </label>


                    <div class="relative">

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm new password"
                            required
                            class="w-full px-4 py-3 pr-12
                                   border border-gray-300
                                   rounded-lg outline-none
                                   focus:ring-2 focus:ring-indigo-500
                                   focus:border-indigo-500
                                   transition"
                        >

                        <button
                            type="button"
                            onclick="togglePassword('confirm_password', 'eye2')"
                            class="absolute right-4 top-1/2
                                   -translate-y-1/2
                                   text-gray-400 hover:text-indigo-600">

                            <i id="eye2"
                               class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- Reset Button -->
                <button
                    type="submit"
                    class="w-full bg-indigo-600
                           hover:bg-indigo-700
                           text-white font-semibold
                           py-3 rounded-lg
                           transition duration-200
                           flex items-center
                           justify-center gap-2">

                    <i class="fa-solid fa-rotate"></i>

                    Reset Password

                </button>

            </form>


            <!-- Back to Login -->
            <div class="text-center mt-6">

                <a href="{% url 'adminlogin' %}"
                   class="text-sm text-indigo-600
                          hover:text-indigo-800
                          font-medium transition">

                    <i class="fa-solid fa-arrow-left mr-1"></i>

                    Back to Login

                </a>

            </div>

        </div>


        <!-- Footer -->
        <p class="text-center text-gray-500 text-xs mt-6">
            © 2026 ShopMart Admin Panel. All rights reserved.
        </p>

    </div>


    <!-- Password Toggle -->
    <script>

        function togglePassword(inputId, iconId) {

            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === "password") {

                input.type = "text";

                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");

            } else {

                input.type = "password";

                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");

            }
        }

    </script>

</body>

</html>
