<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 min-h-screen flex items-center justify-center p-6">

<div class="max-w-6xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden grid lg:grid-cols-2">

    <!-- Left Section -->

    <div class="hidden lg:flex flex-col justify-center items-center bg-gradient-to-br from-indigo-700 via-blue-700 to-cyan-700 p-12 text-white">

        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135768.png"
             class="w-56 mb-8">

        <h1 class="text-4xl font-bold mb-5">
            Admin Registration
        </h1>

        <p class="text-center text-blue-100 leading-7 text-lg">
            Create your administrator account to securely manage products,
            categories, orders, customers and the complete E-Commerce system.
        </p>

    </div>

    <!-- Right Section -->

    <div class="p-10">

        <div class="text-center mb-8">

            <h2 class="text-3xl font-bold text-gray-800">
                Create Admin Account
            </h2>

            <p class="text-gray-500 mt-2">
                Register once to access the Admin Dashboard.
            </p>

        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-5">

            {% csrf_token %}

            <!-- Profile -->

            <div>

                <label class="font-semibold text-gray-700 block mb-2">
                    Profile Image
                </label>

                <input
                    type="file"
                    name="image"
                    accept="image/*"
                    required
                    class="w-full border rounded-xl p-3">

            </div>

            <!-- Full Name -->

            <div>

                <label class="font-semibold text-gray-700 block mb-2">
                    Full Name
                </label>

                <input
                    type="text"
                    name="fullname"
                    placeholder="Enter Full Name"
                    required
                    class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">

            </div>

            
            <!-- Email -->

            <div>

                <label class="font-semibold text-gray-700 block mb-2">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    autocomplete="email"
                    placeholder="admin@example.com"
                    required
                    class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">

            </div>

            <!-- Phone -->

            <div>

                <label class="font-semibold text-gray-700 block mb-2">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    name="phone"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    placeholder="9876543210"
                    required
                    class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">

            </div>

            <!-- Password -->

            <div>

                <label class="font-semibold text-gray-700 block mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    autocomplete="new-password"
                    required
                    placeholder="Create Password"
                    class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">

            </div>

            <!-- Confirm Password -->

            <div>

                <label class="font-semibold text-gray-700 block mb-2">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                    placeholder="Confirm Password"
                    class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">

            </div>

            <!-- Security Checkbox -->

            <div class="flex items-start gap-3">

                <input
                    type="checkbox"
                    required
                    class="mt-1 w-5 h-5 text-indigo-600">

                <label class="text-sm text-gray-600">
                    I confirm that I am authorized to create an administrator account.
                </label>

            </div>

            <!-- Register -->

            <button
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-semibold transition duration-300">

                Create Admin Account

            </button>

        </form>

        <!-- Login -->

        <div class="text-center mt-8">

            <p class="text-gray-600">

                Already registered?
                   
                <a href="{% url 'adminlogin' %}"
                   class="text-indigo-600 font-semibold hover:underline">
                

                    Login Here

                </a>

            </p>

        </div>

    </div>

</div>

</body>
</html>
