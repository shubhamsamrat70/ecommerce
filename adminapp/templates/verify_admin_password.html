<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP - Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-100
             flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8">

            <!-- Icon -->
            <div class="flex justify-center mb-5">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600
                            rounded-full flex items-center justify-center">

                    <i class="fa-solid fa-shield-halved text-2xl"></i>

                </div>
            </div>


            <!-- Heading -->
            <div class="text-center mb-7">

                <h1 class="text-2xl font-bold text-gray-800">
                    Verify OTP
                </h1>

                <p class="text-gray-500 text-sm mt-2">
                    Enter the OTP sent to your registered email address.
                </p>

            </div>


            <!-- Messages -->
            {% if messages %}
                {% for message in messages %}

                    <div class="mb-5 px-4 py-3 rounded-lg
                                bg-red-50 text-red-600
                                text-sm text-center">

                        {{ message }}

                    </div>

                {% endfor %}
            {% endif %}


            <!-- Form -->
            <form method="POST">

                {% csrf_token %}


                <!-- OTP -->
                <div class="mb-6">

                    <label for="otp"
                           class="block text-sm font-semibold
                                  text-gray-700 mb-2">

                        <i class="fa-solid fa-key text-indigo-500 mr-1"></i>

                        Enter OTP

                    </label>


                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        maxlength="6"
                        minlength="6"
                        pattern="[0-9]{6}"
                        inputmode="numeric"
                        placeholder="Enter 6-digit OTP"
                        required
                        class="w-full px-4 py-3
                               border border-gray-300
                               rounded-lg outline-none
                               text-center text-xl
                               tracking-[0.5em]
                               font-semibold
                               focus:ring-2 focus:ring-indigo-500
                               focus:border-indigo-500
                               transition"
                    >

                </div>


                <!-- Verify Button -->
                <button
                    type="submit"
                    class="w-full bg-indigo-600
                           hover:bg-indigo-700
                           text-white font-semibold
                           py-3 rounded-lg
                           transition duration-200
                           flex items-center
                           justify-center gap-2">

                    <i class="fa-solid fa-circle-check"></i>

                    Verify OTP

                </button>

            </form>


            <!-- Resend OTP -->
            <div class="text-center mt-6">

                <p class="text-sm text-gray-500">
                    Didn't receive the OTP?
                </p>

                <a href="{% url 'forgot_admin_password' %}"
                   class="inline-block mt-2
                          text-indigo-600
                          hover:text-indigo-800
                          font-medium text-sm">

                    <i class="fa-solid fa-rotate-right mr-1"></i>

                    Resend OTP

                </a>

            </div>


            <!-- Back to Login -->
            <div class="text-center mt-4">

                <a href="{% url 'adminlogin' %}"
                   class="text-sm text-gray-500
                          hover:text-indigo-600
                          transition">

                    <i class="fa-solid fa-arrow-left mr-1"></i>

                    Back to Login

                </a>

            </div>

        </div>


        <!-- Footer -->
        <p class="text-center text-gray-500 text-xs mt-6">
            © 2026 ShopMart Admin Panel. All rights reserved.
        </p>

    </div>

</body>

</html>
